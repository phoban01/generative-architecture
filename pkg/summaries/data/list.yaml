apiVersion: architecture.local/v1alpha1
kind: EffectSummaries
metadata:
  name: list
spec:
  summaries:
    # A list binds $items, the caller's list local, to $catalog: the
    # identities of the objects of the listed kind that exist and match the
    # call's options, in the order the abstraction declares them. The
    # generator lowers the catalog from the model's finite object domain,
    # so the result is always bounded (ADR-0011); at cached consistency it
    # is the informer cache's view of that domain, which shares the API
    # server's view of existence.
    - operation: list
      consistency: direct
      bindings: [$items, $catalog]
      outcomes:
        - name: ok
          guard: 'true'
          updates:
            $items: $catalog
        - name: error
          guard: 'true'
          error: transient
    - operation: list
      consistency: cached
      bindings: [$items, $catalog]
      outcomes:
        - name: ok
          guard: 'true'
          updates:
            $items: $catalog
        - name: error
          guard: 'true'
          error: transient
