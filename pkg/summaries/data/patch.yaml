apiVersion: architecture.local/v1alpha1
kind: EffectSummaries
metadata:
  name: patch
spec:
  summaries:
    # A merge patch updates the fields present in $value and leaves the
    # rest of the object unchanged. It has no version precondition unless
    # the patch carries one as $options.resourceVersion.
    - operation: patch
      consistency: direct
      bindings: [$exists, $object, $resourceVersion, $value, $snapshotVersion, $options]
      outcomes:
        - name: ok
          guard: $exists && (!has($options.resourceVersion) || $options.resourceVersion == $resourceVersion)
          updates:
            $object: $value
            $resourceVersion: $resourceVersion + 1
            $snapshotVersion: $resourceVersion + 1
        - name: conflict
          guard: $exists && has($options.resourceVersion) && $options.resourceVersion != $resourceVersion
          error: conflict
        - name: notFound
          guard: '!$exists'
          error: notFound
        - name: error
          guard: 'true'
          error: transient
    # Server-side apply creates the object when absent and records that
    # $options.fieldManager owns the applied fields. A field owned by another
    # manager ($contested) is a conflict unless $options.force is set.
    - operation: apply
      consistency: direct
      bindings: [$exists, $object, $resourceVersion, $value, $snapshotVersion, $options, $owners, $contested]
      outcomes:
        - name: ok
          guard: (!$exists || !$contested || (has($options.force) && $options.force)) && (!has($options.resourceVersion) || $options.resourceVersion == $resourceVersion)
          updates:
            $exists: 'true'
            $object: $value
            $resourceVersion: $resourceVersion + 1
            $snapshotVersion: $resourceVersion + 1
            $owners[$options.fieldManager]: $value
        - name: conflict
          guard: $exists && (($contested && !(has($options.force) && $options.force)) || (has($options.resourceVersion) && $options.resourceVersion != $resourceVersion))
          error: conflict
        - name: error
          guard: 'true'
          error: transient
    # A whole-object merge patch of the status subresource (client.Merge):
    # the patch is the caller's object, so it carries the caller's
    # resourceVersion and the API server checks it like an update. The
    # selected status fields ($status) take the status fields the caller
    # passes ($statusValue); a patch computed from a diff (client.MergeFrom)
    # is not summarized.
    - operation: status.patch
      consistency: direct
      bindings: [$exists, $status, $resourceVersion, $statusValue, $snapshotVersion]
      outcomes:
        - name: ok
          guard: $exists && $resourceVersion == $snapshotVersion
          updates:
            $status: $statusValue
            $resourceVersion: $resourceVersion + 1
            $snapshotVersion: $resourceVersion + 1
        - name: conflict
          guard: $exists && $resourceVersion != $snapshotVersion
          error: conflict
        - name: notFound
          guard: '!$exists'
          error: notFound
        - name: error
          guard: 'true'
          error: transient
