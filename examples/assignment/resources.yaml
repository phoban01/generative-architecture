apiVersion: architecture.local/v1alpha1
kind: KubernetesResourceCatalog
metadata:
  name: assignment-api
spec:
  # Finite runtime bindings, supplied from API discovery/CRDs in an integration.
  # No generated Go type or guessed plural is needed for dynamic client access.
  bindings:
    - expression: s.InfraResource
      resource: {group: demo.architecture.local, version: v1alpha1, kind: InfraMachine}
      plural: inframachines
      scope: Namespaced
    - expression: s.ClaimResource
      resource: {group: demo.architecture.local, version: v1alpha1, kind: MachineClaim}
      plural: machineclaims
      scope: Namespaced
