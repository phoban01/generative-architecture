apiVersion: architecture.local/v1alpha1
kind: ProcessSemantics
metadata:
  name: machine-assignment
spec:
  pc: pc
  finished: finished
  results: [outcome]
  # These describe Store effects only. Go supplies their order and conditions.
  operations:
    readInfra:
      - name: readInfra
        guard: 'true'
        updates: {found: infraExists}
        effect: readInfra
    checkContract:
      - name: checkContract
        guard: 'true'
        updates: {compatible: contractSatisfied}
        effect: checkContract
    readClaim:
      - name: readClaim
        guard: 'true'
        updates: {claimFound: claimExists, machineID: claimMachineId}
        effect: readClaim
    createClaim:
      - name: createClaim
        guard: 'true'
        updates: {claimExists: 'true', claimCreates: 'claimCreates + 1'}
        effect: createClaim
    publish:
      - name: publish
        guard: 'true'
        updates: {statusMachineId: _value}
        effect: publish
