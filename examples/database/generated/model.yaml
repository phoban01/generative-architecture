apiVersion: architecture.local/v1alpha1
kind: TransitionModel
metadata:
  name: database
spec:
  name: DatabaseWalkthrough
  state:
    Database_db1_contractSatisfied:
      type: bool
      initial: "false"
    Database_db1_exists:
      type: bool
      initial: "false"
    Database_db1_status_endpoint:
      type: string
      initial: '""'
    DatabaseInstance_inst1_exists:
      type: bool
      initial: "false"
    DatabaseInstance_inst1_spec_databaseName:
      type: string
      initial: '""'
    DatabaseInstance_inst1_status_endpoint:
      type: string
      initial: '""'
    compatible:
      type: bool
      initial: "false"
    databaseEvent:
      type: string
      initial: '""'
    databaseEventPending:
      type: bool
      initial: "false"
    databaseGeneration:
      type: int
      initial: "0"
    databaseGenerationSeen:
      type: int
      initial: "0"
    databaseInstance_Spec_DatabaseName:
      type: string
      initial: '"db-1"'
    databaseInstance_Spec_DatabaseNameSeen:
      type: string
      initial: '"db-1"'
    databaseInstanceEvent:
      type: string
      initial: '""'
    databaseInstanceEventPending:
      type: bool
      initial: "false"
    databaseInstanceGeneration:
      type: int
      initial: "0"
    databaseInstanceGenerationSeen:
      type: int
      initial: "0"
    databaseInstanceResourceVersion:
      type: int
      initial: "0"
    databaseInstanceResourceVersionSeen:
      type: int
      initial: "0"
    databaseResourceVersion:
      type: int
      initial: "0"
    databaseResourceVersionSeen:
      type: int
      initial: "0"
    endpoint:
      type: string
      initial: '""'
    finished:
      type: bool
      initial: "true"
    found:
      type: bool
      initial: "false"
    instanceCreates:
      type: int
      initial: "0"
    instanceFound:
      type: bool
      initial: "false"
    invocations:
      type: int
      initial: "0"
    outcome:
      type: string
      initial: '""'
    pc:
      type: int
      initial: "-1"
    queued_demo_db_1:
      type: bool
      initial: "false"
    wrongKey:
      type: bool
      initial: "false"
  effects:
    - id: checkContract
      resource:
        group: demo.architecture.local
        version: v1alpha1
        kind: Database
      operation: derive
      consistency: schema
    - id: createInstance
      resource:
        group: demo.architecture.local
        version: v1alpha1
        kind: DatabaseInstance
      operation: create
      consistency: direct
    - id: publish
      resource:
        group: demo.architecture.local
        version: v1alpha1
        kind: Database
      operation: status.update
      consistency: direct
    - id: readDatabase
      resource:
        group: demo.architecture.local
        version: v1alpha1
        kind: Database
      operation: get
      consistency: direct
    - id: readInstance
      resource:
        group: demo.architecture.local
        version: v1alpha1
        kind: DatabaseInstance
      operation: get
      consistency: direct
  actions:
    - name: createDb1_false
      guard: '!Database_db1_exists && invocations == 0'
      updates:
        Database_db1_contractSatisfied: "false"
        Database_db1_exists: "true"
        databaseEvent: '"create"'
        databaseEventPending: "false"
        databaseGeneration: databaseGeneration + 1
        databaseGenerationSeen: databaseGeneration + 1
        databaseResourceVersion: databaseResourceVersion + 1
        databaseResourceVersionSeen: databaseResourceVersion + 1
    - name: createDb1_true
      guard: '!Database_db1_exists && invocations == 0'
      updates:
        Database_db1_contractSatisfied: "true"
        Database_db1_exists: "true"
        databaseEvent: '"create"'
        databaseEventPending: "false"
        databaseGeneration: databaseGeneration + 1
        databaseGenerationSeen: databaseGeneration + 1
        databaseResourceVersion: databaseResourceVersion + 1
        databaseResourceVersionSeen: databaseResourceVersion + 1
    - name: changeInst1_1
      guard: DatabaseInstance_inst1_exists && DatabaseInstance_inst1_status_endpoint == ""
      updates:
        DatabaseInstance_inst1_status_endpoint: '"db-1.internal"'
        databaseInstanceEvent: 'databaseInstanceEvent == "" ? "update" : databaseInstanceEvent'
        databaseInstanceEventPending: databaseInstanceEventPending || databaseInstanceEvent == "create"
        databaseInstanceResourceVersion: databaseInstanceResourceVersion + 1
    - name: node0_return
      guard: '!finished && pc == 0 && (true)'
      updates:
        finished: "true"
        outcome: '"ready"'
        pc: "-1"
    - name: node1_publish
      guard: '!finished && pc == 1 && (true)'
      updates:
        Database_db1_status_endpoint: endpoint
        databaseEvent: 'databaseEvent == "" ? "update" : databaseEvent'
        databaseEventPending: databaseEventPending || databaseEvent == "create"
        databaseResourceVersion: databaseResourceVersion + 1
        pc: "0"
      effect: publish
    - name: node2_return
      guard: '!finished && pc == 2 && (true)'
      updates:
        finished: "true"
        outcome: '"waiting"'
        pc: "-1"
    - name: node3_branch
      guard: '!finished && pc == 3 && (true)'
      updates:
        pc: '(endpoint == "") ? 2 : 1'
    - name: node4_return
      guard: '!finished && pc == 4 && (true)'
      updates:
        finished: "true"
        outcome: '"waiting"'
        pc: "-1"
    - name: node5_createInstance
      guard: '!finished && pc == 5 && (true)'
      updates:
        DatabaseInstance_inst1_exists: "true"
        DatabaseInstance_inst1_spec_databaseName: '"db-1"'
        databaseInstanceEvent: '"create"'
        databaseInstanceEventPending: "false"
        databaseInstanceGeneration: databaseInstanceGeneration + 1
        databaseInstanceGenerationSeen: databaseInstanceGeneration + 1
        databaseInstanceResourceVersion: databaseInstanceResourceVersion + 1
        databaseInstanceResourceVersionSeen: databaseInstanceResourceVersion + 1
        instanceCreates: instanceCreates + 1
        pc: "4"
      effect: createInstance
    - name: node6_branch
      guard: '!finished && pc == 6 && (true)'
      updates:
        pc: '!instanceFound ? 5 : 3'
    - name: node7_readInstance
      guard: '!finished && pc == 7 && (true)'
      updates:
        endpoint: DatabaseInstance_inst1_status_endpoint
        instanceFound: DatabaseInstance_inst1_exists
        pc: "6"
      effect: readInstance
    - name: node8_return
      guard: '!finished && pc == 8 && (true)'
      updates:
        finished: "true"
        outcome: '"unsupported"'
        pc: "-1"
    - name: node9_branch
      guard: '!finished && pc == 9 && (true)'
      updates:
        pc: '!compatible ? 8 : 7'
    - name: node10_checkContract
      guard: '!finished && pc == 10 && (true)'
      updates:
        compatible: Database_db1_contractSatisfied
        pc: "9"
      effect: checkContract
    - name: node11_return
      guard: '!finished && pc == 11 && (true)'
      updates:
        finished: "true"
        outcome: '"absent"'
        pc: "-1"
    - name: node12_branch
      guard: '!finished && pc == 12 && (true)'
      updates:
        pc: '!found ? 11 : 10'
    - name: node13_readDatabase
      guard: '!finished && pc == 13 && (true)'
      updates:
        found: Database_db1_exists
        pc: "12"
      effect: readDatabase
    - name: reconcile
      guard: (finished && invocations < 4) && queued_demo_db_1
      updates:
        compatible: "false"
        endpoint: '""'
        finished: "false"
        found: "false"
        instanceFound: "false"
        invocations: invocations + 1
        outcome: '""'
        pc: "13"
        queued_demo_db_1: "false"
    - name: idle
      guard: finished
      updates: {}
    - name: deliverDatabase
      guard: databaseEvent != ""
      updates:
        databaseEvent: 'databaseEventPending ? "update" : ""'
        databaseEventPending: "false"
        databaseGenerationSeen: 'databaseEvent == "create" ? databaseGenerationSeen : databaseGeneration'
        databaseResourceVersionSeen: 'databaseEvent == "create" ? databaseResourceVersionSeen : databaseResourceVersion'
        queued_demo_db_1: "true"
    - name: deliverDatabaseInstance
      guard: databaseInstanceEvent != ""
      updates:
        databaseInstance_Spec_DatabaseNameSeen: 'databaseInstanceEvent == "create" ? databaseInstance_Spec_DatabaseNameSeen : databaseInstance_Spec_DatabaseName'
        databaseInstanceEvent: 'databaseInstanceEventPending ? "update" : ""'
        databaseInstanceEventPending: "false"
        databaseInstanceGenerationSeen: 'databaseInstanceEvent == "create" ? databaseInstanceGenerationSeen : databaseInstanceGeneration'
        databaseInstanceResourceVersionSeen: 'databaseInstanceEvent == "create" ? databaseInstanceResourceVersionSeen : databaseInstanceResourceVersion'
        queued_demo_db_1: queued_demo_db_1 || (databaseInstance_Spec_DatabaseName == "db-1") || ((databaseInstanceEvent == "update") && (databaseInstance_Spec_DatabaseNameSeen == "db-1"))
        wrongKey: wrongKey || (databaseInstance_Spec_DatabaseName != "" && !(databaseInstance_Spec_DatabaseName == "db-1")) || ((databaseInstanceEvent == "update") && (databaseInstance_Spec_DatabaseNameSeen != "" && !(databaseInstance_Spec_DatabaseNameSeen == "db-1")))
    - name: removeDatabaseBeforeRead
      guard: Database_db1_exists && !DatabaseInstance_inst1_exists && invocations == 0
      updates:
        Database_db1_contractSatisfied: "false"
        Database_db1_exists: "false"
        Database_db1_status_endpoint: '""'
        databaseEvent: '"delete"'
        databaseEventPending: "false"
        databaseResourceVersion: databaseResourceVersion + 1
  properties: []
