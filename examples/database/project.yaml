apiVersion: architecture.local/v1alpha1
kind: Project
metadata:
  name: database
spec:
  module: github.com/phoban01/generative-architecture
  packages:
    - ./examples/database
  constraints:
    - constraints.yaml
  runtime:
    profile: controller-runtime
  bounds:
    maxObjectsPerResource: 1
    maxInvocations: 4
