apiVersion: architecture.local/v1alpha1
kind: ModelConstraints
metadata:
  name: database-requirements
spec:
  properties:
    - name: instancesRequireCompatibleDatabase
      expression: '!DatabaseInstance_inst1_exists || (Database_db1_exists && Database_db1_contractSatisfied)'
    - name: atMostOneInstance
      expression: 'instanceCreates <= 1'
    - name: instanceReferencesItsDatabase
      expression: '!DatabaseInstance_inst1_exists || DatabaseInstance_inst1_spec_databaseName == "db-1"'
    - name: publicationRequiresProvisionedInstance
      expression: 'Database_db1_status_endpoint == "" || (DatabaseInstance_inst1_exists && DatabaseInstance_inst1_status_endpoint != "" && Database_db1_status_endpoint == DatabaseInstance_inst1_status_endpoint)'
    - name: waitingHasAInstance
      expression: 'outcome != "waiting" || DatabaseInstance_inst1_exists'
    - name: readyHasEndpoint
      expression: 'outcome != "ready" || Database_db1_status_endpoint != ""'
    - name: databaseWatchEnqueuesReconciler
      expression: 'event != "deliverDatabase" || queued_demo_db_1'
    - name: instanceProvisioningEnqueuesReconciler
      expression: 'event != "deliverDatabaseInstance" || DatabaseInstance_inst1_status_endpoint == "" || queued_demo_db_1'
    - name: watchTargetsDatabase
      expression: '!wrongKey'
