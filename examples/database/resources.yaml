apiVersion: architecture.local/v1alpha1
kind: KubernetesResourceCatalog
metadata:
  name: database-api
spec:
  # Finite runtime bindings, supplied from API discovery/CRDs in an integration.
  # No generated Go type or guessed plural is needed for dynamic client access.
  bindings:
    - expression: s.DatabaseResource
      resource: {group: demo.architecture.local, version: v1alpha1, kind: Database}
      plural: databases
      scope: Namespaced
    - expression: s.InstanceResource
      resource: {group: demo.architecture.local, version: v1alpha1, kind: DatabaseInstance}
      plural: databaseinstances
      scope: Namespaced
