apiVersion: architecture.local/v1alpha1
kind: MutationSuite
metadata:
  name: config-mirror
spec:
  # Two detectors run on each mutation. Nothing is written to the tree.
  # The model detector regenerates the model from the mutated source
  # through a go/packages overlay. It names each property that a state of
  # the targeted scenarios violates. The replay detector compiles the detect
  # command through a build overlay. It replays the committed generated
  # model, its sampled traces and the targeted scenarios, and names each
  # observed model variable whose projection diverges.
  mutations:
    # The manager's client reads the source from the API instead of the
    # informer cache: the copy receives values the cache has not delivered.
    - name: direct-source
      file: adapter.go
      find: cr.SplitClient(a.api, a.cache)
      replace: cr.SplitClient(a.api, a.api)
      expect: [ConfigMap_copy_data_value]
    # The reconciler writes a value it never read. The adapter change
    # above leaves the model unchanged, so only replay sees it; this one
    # changes the model too.
    - name: wrong-write
      file: controller.go
      find: '"value": source.Data["value"]'
      replace: '"value": "corrupt"'
      expect: [ConfigMap_copy_data_value, writesObservedValue]
