name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Build, vet and test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported Go releases listed in README.md.
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # quint verify runs TLC on a JVM. Without Java the temporal tests
      # skip, so CI would never run them. pkg/quint caps the heap at 2 GiB.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # The pinned CronJob module under testdata builds offline from the
      # module cache, which starts empty on the runner. Fill it first.
      - name: Download the CronJob module dependencies
        run: cd testdata/external/cronjob && go mod download
      - name: Test
        # -p 2 caps the packages under test at two at a time, as make test
        # does; a full parallel run needs more memory than a small machine has.
        # cmd/arch runs for several minutes; the default ten-minute timeout
        # is too short on a shared runner.
        run: go test -p 2 -timeout 30m ./...
      - name: Consumer module
        run: make consumer-test

  envtest:
    name: Envtest (Go ${{ matrix.go }})
    needs: go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported Go releases listed in README.md.
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # Installs kube-apiserver and etcd with setup-envtest for the
      # controller-runtime and Kubernetes versions in go.mod, then runs the
      # Envtest tests with go test -p 2. It fails if the assets cannot be
      # installed, a test skips or no test runs.
      - name: Envtest
        run: make envtest

  # The adopter pipeline in arch.yml, run on ConfigMirror. The project
  # document under cmd/arch/testdata declares the controller that
  # examples/configmirror keeps in Go. Quint and LikeC4 come from
  # hack/tools, so CI runs the versions the receipts record.
  architecture:
    name: Architecture pipeline (ConfigMirror)
    needs: go
    uses: ./.github/workflows/arch.yml
    with:
      project: examples/configmirror/project.yaml
      arch-package: ./cmd/arch
      tools-dir: hack/tools
      seed: 20261013
      steer-weight: 8
      steer-except: error
