apiVersion: architecture.local/v1alpha1
kind: Architecture
metadata:
  name: machine-vendor
status:
  implementation: Go / cel-go
  model:
    states:
      - name: infra_calls
        owner: infra
        type: str -> str
        init: INFRAS.mapBy(_ => "")
      - name: infra_wanted
        owner: infra
        type: str -> bool
        init: INFRAS.mapBy(_ => false)
      - name: mac_assigned
        owner: mac
        type: str -> str
        init: INFRAS.mapBy(_ => "")
      - name: mac_claims
        owner: mac
        type: str -> bool
        init: INFRAS.mapBy(_ => false)
      - name: mac_observed
        owner: mac
        type: str -> Assignment
        init: INFRAS.mapBy(_ => EMPTY_ASSIGNMENT)
      - name: claim_epochs
        owner: claim
        type: str -> int
        init: HOSTS.mapBy(_ => 0)
      - name: claim_leases
        owner: claim
        type: str -> Assignment
        init: INFRAS.mapBy(_ => EMPTY_ASSIGNMENT)
      - name: service_machines
        owner: service
        type: str -> str
        init: HOSTS.mapBy(_ => "")
    actions:
      - id: infra.request
        owner: infra
        quint: infra_request
        params:
          - infra
        guard: "true"
        accepted: "true"
        updates:
          infra_wanted: infra_wanted.set(infra, true)
      - id: infra.submit
        owner: infra
        quint: infra_submit
        params:
          - infra
        guard: (mac_assigned.get(infra) != "")
        accepted: "true"
        updates:
          infra_calls: infra_calls.set(infra, mac_assigned.get(infra))
      - id: mac.createClaim
        owner: mac
        quint: mac_createClaim
        params:
          - infra
        guard: infra_wanted.get(infra)
        accepted: "true"
        updates:
          mac_claims: mac_claims.set(infra, true)
      - id: mac.observe
        owner: mac
        quint: mac_observe
        params:
          - infra
        guard: mac_claims.get(infra)
        accepted: "true"
        updates:
          mac_observed: mac_observed.set(infra, claim_leases.get(infra))
      - id: mac.publish
        owner: mac
        quint: mac_publish
        params:
          - infra
        guard: mac_claims.get(infra)
        accepted: allowed
        locals:
          - name: allowed
            value: ((mac_observed.get(infra).machineId != "") and (mac_observed.get(infra) == claim_leases.get(infra)))
        updates:
          mac_assigned: if (allowed) mac_assigned.set(infra, mac_observed.get(infra).machineId) else mac_assigned
      - id: mac.clear
        owner: mac
        quint: mac_clear
        params:
          - infra
        guard: (claim_leases.get(infra).machineId == "")
        accepted: "true"
        updates:
          mac_assigned: mac_assigned.set(infra, "")
      - id: claim.grant
        owner: claim
        quint: claim_grant
        params:
          - infra
          - host
        guard: (((mac_claims.get(infra) and (claim_leases.get(infra).machineId == "")) and INFRAS.forall(i => (claim_leases.get(i).machineId != host))) and ((service_machines.get(host) == "") and (claim_epochs.get(host) < MAX_EPOCH)))
        accepted: "true"
        updates:
          claim_epochs: claim_epochs.set(host, (claim_epochs.get(host) + 1))
          claim_leases: 'claim_leases.set(infra, { epoch: (claim_epochs.get(host) + 1), machineId: host })'
      - id: claim.revoke
        owner: claim
        quint: claim_revoke
        params:
          - infra
        guard: (claim_leases.get(infra).machineId != "")
        accepted: "true"
        updates:
          claim_leases: claim_leases.set(infra, EMPTY_ASSIGNMENT)
      - id: service.execute
        owner: service
        quint: service_execute
        params:
          - infra
        guard: (infra_calls.get(infra) != "")
        accepted: allowed
        locals:
          - name: machineId
            value: infra_calls.get(infra)
          - name: allowed
            value: (service_machines.get(machineId) == "")
        updates:
          service_machines: if (allowed) service_machines.set(infra_calls.get(infra), infra) else service_machines
      - id: service.fence
        owner: service
        quint: service_fence
        params:
          - host
        guard: INFRAS.forall(i => (claim_leases.get(i).machineId != host))
        accepted: "true"
        updates:
          service_machines: service_machines.set(host, "")
    bindings:
      - from: infra.eligible
        to: mac.eligible
        protocol: mac-inframachine/v1
        key: inframachine-uid
        state: infra_wanted
        evidence: explicit validated binding
      - from: mac.claim
        to: claim.claim
        protocol: machine-claim/v1
        key: inframachine-uid
        state: mac_claims
        evidence: explicit validated binding
      - from: claim.lease
        to: mac.lease
        protocol: claim-assignment/v1
        key: inframachine-uid
        state: claim_leases
        evidence: explicit validated binding
      - from: mac.assignment
        to: infra.assignment
        protocol: assigned-machine-id/v1
        key: inframachine-uid
        state: mac_assigned
        evidence: explicit validated binding
      - from: infra.provision
        to: service.calls
        protocol: provision-call/v1
        key: inframachine-uid
        state: infra_calls
        evidence: explicit validated binding
      - from: claim.lease
        to: service.lifecycle
        protocol: claim-assignment/v1
        key: inframachine-uid
        state: claim_leases
        evidence: 'prototype assumption: fence only after lease release; not a provisioning authorization check'
      - from: service.physical
        to: claim.physical
        protocol: physical-assignment/v1
        key: physical-host-id
        state: service_machines
        evidence: explicit validated binding
    properties:
      - name: publicationRequiresCurrentLease
        expression: (((event.name != "mac.publish") or not(event.accepted)) or ((mac_assigned.get(event.infra) == claim_leases.get(event.infra).machineId) and (claim_leases.get(event.infra).machineId != "")))
      - name: exclusiveLeases
        expression: INFRAS.forall(a => INFRAS.forall(b => (((a == b) or (claim_leases.get(a).machineId == "")) or (claim_leases.get(a).machineId != claim_leases.get(b).machineId))))
      - name: provisionRequiresCurrentLease
        expression: (((event.name != "service.execute") or not(event.accepted)) or (infra_calls.get(event.infra) == claim_leases.get(event.infra).machineId))
    inputState:
      claim.claim: mac_claims
      claim.physical: service_machines
      infra.assignment: mac_assigned
      mac.eligible: infra_wanted
      mac.lease: claim_leases
      service.calls: infra_calls
      service.lifecycle: claim_leases
