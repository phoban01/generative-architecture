apiVersion: architecture.local/v1alpha1
kind: SourceBindings
metadata:
  name: mac
spec:
  # Code markers identify resources, controllers and action methods.
  # This file declares the semantic joins; contracts supply protocols and identity keys.
  controllers:
    mac:
      primary: InfraMachine
      owns: MachineClaim
      ports:
        eligible: InfraMachine.Spec.AllocationRequested
        claim: MachineClaim.$exists
        lease: MachineClaim.Status
        assignment: InfraMachine.Status.MachineID
