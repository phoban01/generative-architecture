apiVersion: architecture.local/v1alpha1
kind: Contract
metadata:
  name: mac
spec:
  version: 0.3.0
  title: Machine allocation controller (MAC)
  origin: owned-example
  description: Recognizes the InfraMachine contract, creates a MachineClaim, observes its lease
    assignment, and publishes only the machine ID back to the InfraMachine.
  state:
    claims:
      type: map(string, bool)
      init:
        domain: INFRAS
        value: "false"
    observed:
      type: map(string, Assignment)
      init:
        domain: INFRAS
        value: EMPTY_ASSIGNMENT
    assigned:
      type: map(string, string)
      init:
        domain: INFRAS
        value: '""'
  ports:
    eligible:
      direction: in
      protocol: mac-inframachine/v1
      type: map(string, bool)
      key: inframachine-uid
    claim:
      direction: out
      protocol: machine-claim/v1
      type: map(string, bool)
      key: inframachine-uid
      state: claims
    lease:
      direction: in
      protocol: claim-assignment/v1
      type: map(string, Assignment)
      key: inframachine-uid
    assignment:
      direction: out
      protocol: assigned-machine-id/v1
      type: map(string, string)
      key: inframachine-uid
      state: assigned
  actions:
    - name: createClaim
      params:
        - infra
      guard: eligible[infra]
      updates:
        claims:
          key: infra
          value: "true"
      accepted: "true"
    - name: observe
      params:
        - infra
      guard: claims[infra]
      updates:
        observed:
          key: infra
          value: lease[infra]
      accepted: "true"
    - name: publish
      params:
        - infra
      guard: claims[infra]
      updates:
        assigned:
          key: infra
          value: observed[infra].machineId
          when: allowed
      accepted: allowed
      locals:
        allowed: observed[infra].machineId != "" && observed[infra] == lease[infra]
    - name: clear
      params:
        - infra
      guard: lease[infra].machineId == ""
      updates:
        assigned:
          key: infra
          value: '""'
      accepted: "true"
