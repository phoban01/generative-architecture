apiVersion: architecture.local/v1alpha1
kind: Contract
metadata:
  name: infra
spec:
  version: 0.3.0
  title: CAPI InfraMachine controller
  origin: external-contract
  description: Implements the MAC contract, requests allocation, then calls provisioning with the
    returned machine ID. Has no lease-specific input. Abstract upstream/provider behavior, not
    executed CAPI.
  state:
    wanted:
      type: map(string, bool)
      init:
        domain: INFRAS
        value: "false"
    calls:
      type: map(string, string)
      init:
        domain: INFRAS
        value: '""'
  ports:
    eligible:
      direction: out
      protocol: mac-inframachine/v1
      type: map(string, bool)
      key: inframachine-uid
      state: wanted
    assignment:
      direction: in
      protocol: assigned-machine-id/v1
      type: map(string, string)
      key: inframachine-uid
    provision:
      direction: out
      protocol: provision-call/v1
      type: map(string, string)
      key: inframachine-uid
      state: calls
  actions:
    - name: request
      params:
        - infra
      guard: "true"
      updates:
        wanted:
          key: infra
          value: "true"
      accepted: "true"
    - name: submit
      params:
        - infra
      guard: assignment[infra] != ""
      updates:
        calls:
          key: infra
          value: assignment[infra]
      accepted: "true"
