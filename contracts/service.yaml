apiVersion: architecture.local/v1alpha1
kind: Contract
metadata:
  name: service
spec:
  version: 0.3.0
  title: Machine provisioning service
  origin: owned-example
  description: Executes the queued machine-ID call with no independent lease authorization check.
    Fencing after release is an abstract lifecycle operation.
  state:
    machines:
      type: map(string, string)
      init:
        domain: HOSTS
        value: '""'
  ports:
    calls:
      direction: in
      protocol: provision-call/v1
      type: map(string, string)
      key: inframachine-uid
    physical:
      direction: out
      protocol: physical-assignment/v1
      type: map(string, string)
      key: physical-host-id
      state: machines
    lifecycle:
      direction: in
      protocol: claim-assignment/v1
      type: map(string, Assignment)
      key: inframachine-uid
  actions:
    - name: execute
      params:
        - infra
      guard: calls[infra] != ""
      updates:
        machines:
          key: calls[infra]
          value: infra
          when: allowed
      accepted: allowed
      locals:
        machineId: calls[infra]
        allowed: machines[machineId] == ""
    - name: fence
      params:
        - host
      guard: INFRAS.all(i, lifecycle[i].machineId != host)
      updates:
        machines:
          key: host
          value: '""'
      accepted: "true"
